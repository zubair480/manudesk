[project]
name = "manudesk"
version = "0.1.0"
description = "A hardware feedback loop for coding agents: hidden testbench + real place and route as MCP tools"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.12",
    "uvicorn>=0.30",
    "starlette>=0.40",
    "openai>=1.40",
    "python-dotenv>=1.0",
    "httpx>=0.28.1",
    "anyio>=4.15.1",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
manudesk = "manudesk.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["manudesk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
